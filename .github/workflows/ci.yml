name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
      S3_BUCKET_NAME: test-bucket-for-ci
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: testdb
      DB_USER: testuser
      DB_PASSWORD: testpass
      JWT_SECRET_KEY: ci-test-secret-not-used-in-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cloudvault-app:ci-${{ github.sha }} .

  deploy:
    needs: [test, docker-build]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy latest code
        run: |
          cd /home/ec2-user/cloudvault-app
          git fetch origin main
          git reset --hard origin/main
          pip3 install -r requirements.txt --user

          # A backgrounded process (nohup + &) gets killed by the runner when this
          # job ends -- it isn't protected from that, only from a hangup signal.
          # A systemd service runs independently of the job that started it, and
          # survives both job completion and EC2 reboots (Restart=always also
          # brings it back up if it ever crashes on its own).
          sudo tee /etc/systemd/system/cloudvault.service > /dev/null <<'EOF'
          [Unit]
          Description=CloudVault Flask app
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=/home/ec2-user/cloudvault-app
          ExecStart=/usr/bin/python3 /home/ec2-user/cloudvault-app/app.py
          Restart=always
          User=ec2-user

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload
          sudo systemctl enable cloudvault
          sudo systemctl restart cloudvault
          sleep 3
          curl -s http://localhost:5000/health